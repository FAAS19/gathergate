name: Country / Domain Validator Pack
description: Propose or contribute a deterministic Validator Pack (e.g. NZ, CA, SG, JP)
labels: ["enhancement", "validator-pack", "good first issue"]
body:
  - type: input
    id: country
    attributes:
      label: Country or domain
      placeholder: "e.g. New Zealand (nz), Canada (ca), Singapore (sg)"
    validations:
      required: true

  - type: textarea
    id: identifiers
    attributes:
      label: Identifiers & checksum algorithms
      description: List each identifier, format, and official checksum/validation specification.
      placeholder: |
        - NZ IRD: 8 or 9 digits, Inland Revenue mod-11 checksum (sensitive)
        - CA SIN: 9 digits, Luhn mod-10 checksum (masked/sensitive)
    validations:
      required: true

  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitivity
      options:
        - label: Contains government tax/health IDs that must be masked by default (`sensitive: true`)

  - type: textarea
    id: references
    attributes:
      label: Official specification links & test fixtures
      description: Links to official government or standards documentation (never include real personal numbers).
    validations:
      required: true
