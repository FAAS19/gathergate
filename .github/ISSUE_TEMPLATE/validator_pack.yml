name: Country / Domain Validator Pack
description: Propose or contribute a deterministic Validator Pack (e.g. UK, NZ, US, CA, EU)
labels: ["enhancement", "validator-pack", "good first issue"]
body:
  - type: input
    id: country
    attributes:
      label: Country or domain
      placeholder: "e.g. United Kingdom (uk), New Zealand (nz), United States (us)"
    validations:
      required: true

  - type: textarea
    id: identifiers
    attributes:
      label: Identifiers & checksum algorithms
      description: List each identifier, format, and official checksum/validation specification.
      placeholder: |
        - UK UTR: 10 digits, HMRC weighted mod-11 checksum
        - UK NINO: prefix rules + format (masked/sensitive)
    validations:
      required: true

  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitivity
      options:
        - label: Contains government tax/health IDs that must be masked by default (`sensitive: true`)

  - type: textarea
    id: references
    attributes:
      label: Official specification links & test fixtures
      description: Links to official government or standards documentation (never include real personal numbers).
    validations:
      required: true
