name: Bug Report
description: Report a reproducible bug in GatherGate
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        For security vulnerabilities, do not open a public issue. Email
        contact@tensorforge.dev as described in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear summary of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. Observe error
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Docker (docker compose / docker run)
        - Local Node.js (npm start / npm run dev)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit SHA & Node version
      placeholder: "e.g. v0.1.0, Node 24.x"
    validations:
      required: true
