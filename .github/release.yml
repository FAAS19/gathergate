changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
        - mcp
    - title: Validator Packs
      labels:
        - validator-pack
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - docs
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
