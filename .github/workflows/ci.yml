name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Unit, Vitest & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Backend & client unit tests
        run: npm test

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E & WCAG 2.2 AA audit
        run: npm run test:e2e

      - name: Upload Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/.results
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gathergate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
