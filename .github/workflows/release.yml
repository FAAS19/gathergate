name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-container:
    name: Build & publish multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify release tag matches package.json & README hygiene
        run: |
          node -e "const v = require('./package.json').version; const tag = process.env.GITHUB_REF_NAME; if (tag !== 'v' + v) { console.error('Tag', tag, 'does not match package.json v' + v); process.exit(1); }"
          node e2e/verify-readme.mjs

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify release tag matches package.json
        run: |
          node -e "const v = require('./package.json').version; const tag = process.env.GITHUB_REF_NAME; if (tag !== 'v' + v) { console.error('Tag', tag, 'does not match package.json v' + v); process.exit(1); }"

      - name: Ensure npm supports OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies and build
        run: |
          npm ci
          npm --prefix client ci
          npm run build

      - name: Publish package to npm
        run: |
          TAG="latest"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then TAG="next"; fi
          npm publish --provenance --access public --tag "$TAG"

  github-release:
    name: Create GitHub Release
    needs: [publish-container, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
