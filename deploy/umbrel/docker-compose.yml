version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: gathergate_web_1
      APP_PORT: 3080
      # Allow client magic-link portals, static SPA assets, public workspace logos, and health checks
      # without an Umbrel session while keeping operator routes behind Umbrel login + GatherGate auth.
      PROXY_AUTH_WHITELIST: "/c/*,/assets/*,/favicon.svg,/site.webmanifest,/api/client/*,/api/public/*,/healthz"

  web:
    image: ghcr.io/faas19/gathergate:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3080"
      DATA_DIR: /data
      # Set to a reachable LAN origin (http://<device-host>:3080) or public HTTPS origin before creating requests.
      BASE_URL: ${BASE_URL:-http://umbrel.local:3080}
      TRUST_PROXY: "true"
      TZ: UTC
    volumes:
      - ${APP_DATA_DIR}/data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
