manifestVersion: 1
id: gathergate
category: files
name: GatherGate
version: "1.1.2"
tagline: Self-hosted magic-link client document checklist and encrypted intake vault
description: >-
  GatherGate is an open-source, self-hosted client document collection portal,
  deterministic regional validator (AU/UK/US/EU checksums), encrypted file vault,
  and automated follow-up engine. Collect tax, legal, onboarding, and patient
  checklists over passwordless magic links with AES-256-GCM encryption at rest,
  scoped workspace API keys, signed webhooks, and a metadata-only MCP 2.0 server.
developer: TensorForge
website: https://gathergate.app/
dependencies: []
repo: https://github.com/FAAS19/gathergate
support: https://github.com/FAAS19/gathergate/issues
port: 3088
storage:
  dataRoot: data
gallery:
  - https://gathergate.app/social-preview.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  v1.1.2 hardens streaming ZIP export, fail-closed webhook signing, UTF-8/OpenXML
  upload validation, MCP schema checks, ReviewSheet keyboard triage, and HTTP Range
  media delivery.
submitter: TensorForge
submission: https://github.com/FAAS19/gathergate
