# Fly.io configuration for self-hosted GatherGate (single-machine persistent volume)
# Quickstart (replace <your-app-name> consistently across every command):
#   fly apps create <your-app-name>
#   fly volumes create gathergate_data --region syd --size 10 -a <your-app-name>
#   fly secrets set MASTER_KEY="$(openssl rand -hex 32)" BASE_URL="https://<your-app-name>.fly.dev" -a <your-app-name>
#   fly deploy -c deploy/fly/fly.toml -a <your-app-name>

app = "gathergate"
primary_region = "syd"

[build]
  image = "ghcr.io/faas19/gathergate:latest"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3080"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"
  TZ = "UTC"

[[mounts]]
  source = "gathergate_data"
  destination = "/data"

[http_service]
  internal_port = 3080
  force_https = true
  # Keep one machine running so scheduled reminder, webhook retry, and purge sweeps stay active.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
