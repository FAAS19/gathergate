# Coolify service template for self-hosted GatherGate
# Documentation: https://gathergate.tensorforge.dev/docs/deployment/one-click-templates/
services:
  gathergate:
    image: ghcr.io/faas19/gathergate:latest
    restart: unless-stopped
    environment:
      - SERVICE_URL_GATHERGATE_3080
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3080
      - DATA_DIR=/data
      - TRUST_PROXY=true
      - BASE_URL=${SERVICE_URL_GATHERGATE_3080}
      # Set a 64-character hex key (`openssl rand -hex 32`) in Coolify Environment Variables for production.
      # Leave empty on first boot to auto-generate /data/.master.key on the persistent volume.
      - MASTER_KEY=${MASTER_KEY:-}
      - TZ=${TZ:-UTC}
    volumes:
      - gathergate-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gathergate-data:
