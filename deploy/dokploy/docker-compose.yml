# Dokploy blueprint compose file for self-hosted GatherGate
# Companion config: deploy/dokploy/template.toml
services:
  gathergate:
    image: ghcr.io/faas19/gathergate:latest
    user: "1000:1000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3080"
      DATA_DIR: /data
      TRUST_PROXY: "true"
      BASE_URL: ${BASE_URL}
      # Optional 64-character hex key (`openssl rand -hex 32`); auto-generated at /data/.master.key if omitted.
      MASTER_KEY: ${MASTER_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - gathergate-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gathergate-data:
