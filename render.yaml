# Render Blueprint for self-hosted GatherGate (persistent disk required for SQLite WAL & encrypted vault).
# One-click deploy: https://render.com/deploy?repo=https://github.com/FAAS19/gathergate
services:
  - type: web
    name: gathergate
    runtime: image
    plan: starter
    image:
      url: ghcr.io/faas19/gathergate:latest
    healthCheckPath: /healthz
    disk:
      name: gathergate-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3080"
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "true"
      # BASE_URL automatically falls back to Render's RENDER_EXTERNAL_URL; set BASE_URL in Render Environment if you attach a custom domain.
      # GatherGate auto-generates /data/.master.key on first boot; copy that existing key into Render Secret Env Vars for production (or generate a new key with `openssl rand -hex 32` only before storing any data).
      - key: TZ
        value: UTC
